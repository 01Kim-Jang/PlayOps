name: Deploy to test server

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  workflow_dispatch:

# 동시 배포 금지. 진행 중인 배포는 취소하지 않고 순서대로 처리한다.
concurrency:
  group: deploy-test-server
  cancel-in-progress: false

jobs:
  deploy:
    # 테스트 서버는 공유기가 해외 IP 인바운드를 막고 있어 GitHub 호스티드 러너에서
    # 접속할 수 없다. 서버에 설치한 self-hosted 러너가 아웃바운드로 작업을 가져간다.
    runs-on: [self-hosted, playops-testserver]
    timeout-minutes: 20

    steps:
      - name: 배포
        run: |
          set -euo pipefail
          cd /home/playops/playops

          # 서버에 수동 수정이 남아 있으면 덮어쓰지 않고 실패시킨다.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::서버 작업트리에 커밋되지 않은 변경이 있습니다."
            git status --short
            exit 1
          fi

          PREV=$(git rev-parse HEAD)
          git fetch --quiet origin main
          git merge --ff-only origin/main
          NEW=$(git rev-parse HEAD)

          if [ "$PREV" = "$NEW" ]; then
            echo "변경 없음 (${NEW:0:8})"
          else
            echo "배포: ${PREV:0:8} -> ${NEW:0:8}"
            git --no-pager log --oneline "$PREV".."$NEW"
          fi

          CHANGED=$(git diff --name-only "$PREV" "$NEW" || true)

          # --- 환경변수 점검 (값은 읽지 않고 키 이름만 비교한다) ---
          # .env 는 gitignore 라 서버에서 손으로 관리한다. 새 변수가 추가됐는데
          # 서버에 반영이 안 되면 조용히 compose 기본값으로 동작하므로 여기서 잡는다.
          if [ ! -f .env ]; then
            echo "::error::.env 가 없습니다."
            exit 1
          fi

          MISSING=$(comm -23 \
            <(grep -oE '^[A-Z_][A-Z0-9_]*' .env.example | sort -u) \
            <(grep -oE '^[A-Z_][A-Z0-9_]*' .env | sort -u) || true)
          if [ -n "$MISSING" ]; then
            while read -r k; do
              [ -n "$k" ] && echo "::warning::서버 .env 에 $k 가 없습니다 (compose 기본값으로 동작 중)"
            done <<< "$MISSING"
          else
            echo "환경변수 키 일치"
          fi

          # prod 프로필에서 암호화 키가 비어 있으면 API 가 기동에 실패한다.
          PROFILE=$(grep -E '^SPRING_PROFILES_ACTIVE=' .env | cut -d= -f2- || true)
          ENCKEY=$(grep -E '^PLAYOPS_ENCRYPTION_KEY=' .env | cut -d= -f2- || true)
          if [ "$PROFILE" = "prod" ] && [ -z "$ENCKEY" ]; then
            echo "::error::prod 프로필인데 PLAYOPS_ENCRYPTION_KEY 가 비어 있습니다. API 가 기동하지 못합니다."
            exit 1
          fi


          # api/web은 소스를 바인드 마운트해 핫리로드된다
          # (gradle --continuous + Spring DevTools, vite HMR) — 재빌드가 필요 없다.
          # worker는 이미지에 소스를 COPY하므로 재빌드해야 반영된다.
          if printf '%s\n' "$CHANGED" | grep -qE '^(docker-compose\.dev\.yml|apps/worker/|apps/web/package|apps/api/Dockerfile)'; then
            echo "--- 이미지 재빌드 필요 ---"
            docker compose -f docker-compose.dev.yml up -d --build
          else
            echo "--- 핫리로드로 반영, 컨테이너 상태만 확인 ---"
            docker compose -f docker-compose.dev.yml up -d
          fi

          # ai-runner는 api 컨테이너와 별개로, api 프로세스가 필요할 때마다 직접
          # `docker build`해서 만드는 이미지라 (AiRunnerDockerService.ensureRunnerImage,
          # 이미지가 이미 있으면 재빌드하지 않음) 위 docker compose 재빌드 대상에 안 걸린다.
          # run.js 등 ai-runner 소스가 바뀌었으면 이미지를 지워서 다음 AI 작업 때 새로 빌드되게 한다.
          if printf '%s\n' "$CHANGED" | grep -qE '^apps/api/(ai-runner/|ai-runner\.Dockerfile)'; then
            echo "--- ai-runner 소스 변경 감지, playops-ai-runner:latest 재빌드 유도 ---"
            docker rmi playops-ai-runner:latest 2>/dev/null || true
          fi

      - name: Health check
        run: |
          set -euo pipefail
          cd /home/playops/playops
          # web은 재빌드 시 npm install 이 끝나야 응답하므로 api/web 모두 같은 시간창 안에서 재시도한다.
          API_UP=0; WEB_UP=0
          for i in $(seq 1 48); do
            if [ "$API_UP" = 0 ] && curl -sf -m 5 localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              API_UP=1; echo "API UP ($((i * 5))초)"
            fi
            if [ "$WEB_UP" = 0 ]; then
              WEB_CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 10 localhost:3000 || true)
              if [ "$WEB_CODE" = 200 ]; then
                WEB_UP=1; echo "WEB UP ($((i * 5))초)"
              fi
            fi
            if [ "$API_UP" = 1 ] && [ "$WEB_UP" = 1 ]; then
              docker ps --format 'table {{.Names}}\t{{.Status}}'
              exit 0
            fi
            sleep 5
          done
          echo "::error::health check 실패 (API_UP=$API_UP WEB_UP=$WEB_UP)"
          docker compose -f docker-compose.dev.yml logs --tail 60 api web
          exit 1

      - name: PlayOps 자체 회귀 테스트 (self-test 게이트)
        run: |
          set -euo pipefail
          cd /home/playops/playops
          API=http://localhost:8080

          LOGIN_USER=$(grep -E '^LOGIN_USERNAME=' .env | cut -d= -f2- || true); LOGIN_USER=${LOGIN_USER:-admin}
          LOGIN_PASS=$(grep -E '^LOGIN_PASSWORD=' .env | cut -d= -f2- || true); LOGIN_PASS=${LOGIN_PASS:-admin}

          TOKEN=$(curl -sf -X POST "$API/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$LOGIN_USER\",\"password\":\"$LOGIN_PASS\"}" | jq -r '.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::self-test 게이트: 로그인 실패, 토큰을 받지 못했습니다."
            exit 1
          fi

          SUITE_ID=$(curl -sf -H "Authorization: Bearer $TOKEN" \
            "$API/api/projects/playops-self/test-suites" \
            | jq -r '.[] | select(.name=="PlayOps Self Regression") | .id')

          if [ -z "$SUITE_ID" ] || [ "$SUITE_ID" = "null" ]; then
            echo "::error::playops-self 프로젝트에 'PlayOps Self Regression' 스위트가 없습니다 (DataLoader 시드 확인 필요)."
            exit 1
          fi

          EXEC_ID=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
            "$API/api/projects/playops-self/test-suites/$SUITE_ID/execute" | jq -r '.id')
          echo "self-test 실행 시작: execution #$EXEC_ID"

          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(curl -sf -H "Authorization: Bearer $TOKEN" "$API/api/executions/$EXEC_ID" | jq -r '.execution.status')
            case "$STATUS" in
              PASSED)
                echo "self-test 통과 (execution #$EXEC_ID, $((i * 10))초)"
                exit 0
                ;;
              FAILED|ERROR|CANCELLED)
                break
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "::error::PlayOps 자체 회귀 테스트 실패 (status=$STATUS, execution #$EXEC_ID)"
          curl -s -H "Authorization: Bearer $TOKEN" "$API/api/executions/$EXEC_ID" | jq -r '.logOutput' || true
          exit 1
